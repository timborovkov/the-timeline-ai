name: Bug report
description: Report a reproducible, non-sensitive problem
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Use synthetic examples and remove personal/customer data,
        credentials, and private links. For private support, use https://thetimeline.cc/help/support.
        Report vulnerabilities privately: https://github.com/timborovkov/the-timeline-ai/security/policy

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observable problem without private data.
      placeholder: A concise description of the failure.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a new test account and synthetic examples where possible.
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the Timeline version or commit, browser, and operating system when relevant. Do not paste full private URLs or request headers.
      placeholder: Timeline commit, browser version, operating system
