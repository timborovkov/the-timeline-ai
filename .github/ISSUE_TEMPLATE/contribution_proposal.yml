name: Feature or improvement
description: Suggest a feature or improvement
body:
  - type: markdown
    attributes:
      value: |
        Suggestions are welcome; you do not need to implement them.
        This issue is public. Use synthetic examples and remove personal/customer data,
        credentials, and private links. For private support, use https://thetimeline.cc/help/support.
        Report vulnerabilities privately: https://github.com/timborovkov/the-timeline-ai/security/policy.

        Before substantial implementation or a PR, agree scope and contribution terms
        with a maintainer as described in CONTRIBUTING.md.

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Describe the observable need without private data.
      placeholder: What is difficult, missing, or worth improving?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Explain the user-visible or operational result, not a large implementation plan.
      placeholder: What should be true when this is complete?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Suggested scope
      description: Note likely boundaries, affected surfaces, and anything intentionally out of scope.
      placeholder: A concise proposed boundary for maintainer review.
