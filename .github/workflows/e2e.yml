name: E2E

on:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: e2e_auth_secret_at_least_sixteen_chars
      AUTH_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      DATABASE_URL: postgres://timeline:timeline_dev@127.0.0.1:5432/timeline
      INBOUND_EMAIL_DOMAIN: e2e.localhost
      E2E_RUN_ID: local
      E2E_NAMESPACE: gha-${{ github.run_id }}-${{ github.run_attempt }}
      LOG_LEVEL: silent
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', '.bun-version') }}

      - name: Install dependencies
        run: bun run deps --frozen-lockfile

      - name: Start isolated fixture services
        run: |
          docker compose -p timeline-e2e up -d --wait postgres redis qdrant rustfs
          docker compose -p timeline-e2e run --rm rustfs-init

      - name: Install Playwright browser
        run: bun x --bun --no-install playwright install --with-deps chromium webkit

      - name: Run migrations
        run: bun run db:migrate

      - name: Run Playwright E2E
        run: bun run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Stop isolated fixture services
        if: always()
        run: docker compose -p timeline-e2e down --volumes

  prod-smoke:
    name: Production-ish web smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: timeline
          POSTGRES_PASSWORD: timeline_dev
          POSTGRES_DB: timeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timeline -d timeline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_SECRET: e2e_auth_secret_at_least_sixteen_chars
      AUTH_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      DATABASE_URL: postgres://timeline:timeline_dev@127.0.0.1:5432/timeline
      INBOUND_EMAIL_DOMAIN: e2e.localhost
      E2E_RUN_ID: gha-prod-${{ github.run_id }}-${{ github.run_attempt }}
      LOG_LEVEL: silent
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', '.bun-version') }}

      - name: Install dependencies
        run: bun run deps --frozen-lockfile

      - name: Install Playwright browser
        run: bun x --bun --no-install playwright install --with-deps chromium webkit

      - name: Run migrations
        run: bun run db:migrate

      - name: Run production-ish smoke
        run: bun run e2e:prod-smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-prod-smoke
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
