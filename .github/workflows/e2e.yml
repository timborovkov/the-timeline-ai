name: E2E

on:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: e2e_auth_secret_at_least_sixteen_chars
      AUTH_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      DATABASE_URL: postgres://timeline:timeline_dev@127.0.0.1:5432/timeline
      INBOUND_EMAIL_DOMAIN: e2e.localhost
      E2E_RUN_ID: local
      E2E_NAMESPACE: gha-${{ github.run_id }}-${{ github.run_attempt }}
      LOG_LEVEL: silent
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', '.bun-version') }}

      - name: Install dependencies
        run: bun run deps --frozen-lockfile

      - name: Start isolated fixture services
        run: |
          docker compose -p timeline-e2e up -d --wait postgres redis qdrant rustfs
          docker compose -p timeline-e2e run --rm rustfs-init

      - name: Install Playwright browser
        run: bun x --bun --no-install playwright install --with-deps chromium webkit

      - name: Run migrations
        run: bun run db:migrate

      - name: Build workspace imports for Playwright
        run: bun run test:dist-imports

      - name: Run Playwright E2E
        run: |
          # Keep resource/exit evidence even if fixture build or warmup is interrupted.
          # Print process names only: command arguments can contain fixture secrets.
          snapshot_resources() {
            date -u || true
            free -m || true
            ps -eo pid,ppid,pgid,rss,comm --sort=-rss | head -15 || true
            for metric in memory.current memory.max memory.events; do
              if [ -r "/sys/fs/cgroup/$metric" ]; then
                echo "$metric"
                cat "/sys/fs/cgroup/$metric" || true
              fi
            done
          }
          while true; do snapshot_resources; sleep 30; done &
          monitor_pid=$!
          trap 'status=$?; kill "$monitor_pid" 2>/dev/null || true; snapshot_resources; exit "$status"' EXIT
          bun run e2e:precompiled e2e/00-quiet-archive.visual.spec.ts --project=chromium --grep 'public Quiet Archive surfaces|authenticated Quiet Archive surfaces' --update-snapshots=all

      - name: Upload canonical Linux Chromium goldens
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: canonical-quiet-archive-goldens
          if-no-files-found: error
          path: |
            e2e/00-quiet-archive.visual.spec.ts-snapshots/landing-light-mobile-chromium-linux.png
            e2e/00-quiet-archive.visual.spec.ts-snapshots/help-light-desktop-chromium-linux.png
            e2e/00-quiet-archive.visual.spec.ts-snapshots/home-light-desktop-chromium-linux.png

      - name: Verify the selected golden images and the original sibling snapshots
        env:
          E2E_PRECOMPILED: '1'
          E2E_NAMESPACE: gha-${{ github.run_id }}-${{ github.run_attempt }}-v
        run: |
          git restore --worktree -- e2e/00-quiet-archive.visual.spec.ts-snapshots/sign-in-light-desktop-chromium-linux.png e2e/00-quiet-archive.visual.spec.ts-snapshots/team-settings-light-mobile-chromium-linux.png
          bun run e2e e2e/00-quiet-archive.visual.spec.ts --project=chromium --grep 'public Quiet Archive surfaces|authenticated Quiet Archive surfaces'

      - name: Stop isolated fixture services
        if: always()
        run: docker compose -p timeline-e2e down --volumes
