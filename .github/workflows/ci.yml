name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  ci:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use corepack instead of `pnpm/action-setup`. The latter's codeload
      # archives have been intermittently 404ing from GitHub-hosted runners
      # across multiple v4.x SHAs. Corepack ships with Node and pins pnpm
      # via the project's `packageManager` field — same effect, no external
      # action download.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Configure pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static checks
        env:
          AUTH_SECRET: ci_dummy_secret_at_least_16_chars
          DATABASE_URL: postgres://placeholder@localhost:5432/placeholder
        run: pnpm validate

      - name: Focused tests
        env:
          AUTH_SECRET: ci_dummy_secret_at_least_16_chars
          DATABASE_URL: postgres://placeholder@localhost:5432/placeholder
        run: pnpm test:ci

      - name: Production web build
        env:
          AUTH_SECRET: ci_dummy_secret_at_least_16_chars
          DATABASE_URL: postgres://placeholder@localhost:5432/placeholder
          NODE_ENV: production
        run: pnpm --filter @timeline/db build && pnpm --filter @timeline/shared build && pnpm --filter @timeline/web build
