name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  ci:
    name: Lint · Typecheck · Format · Knip · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages
        env:
          # Build-time dummy values; never used at runtime.
          AUTH_SECRET: ci_dummy_secret_at_least_16_chars
          DATABASE_URL: postgres://placeholder@localhost:5432/placeholder
        run: pnpm build

      - name: Knip (dead code / unused deps)
        env:
          DATABASE_URL: postgres://placeholder@localhost:5432/placeholder
        run: pnpm knip
