name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  ci:
    name: Lint · Typecheck · Format · Knip · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Pin to v4.4.0 SHA explicitly. The v4 tag was previously resolving
        # to a v4.3.0 SHA whose codeload archive was persistently returning
        # 404 from the Azure-hosted runners — re-runs stayed broken. Newer
        # SHA bypasses the bad cache.
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages
        env:
          # Build-time dummy values; never used at runtime.
          AUTH_SECRET: ci_dummy_secret_at_least_16_chars
          DATABASE_URL: postgres://placeholder@localhost:5432/placeholder
        run: pnpm build

      - name: Knip (dead code / unused deps)
        env:
          DATABASE_URL: postgres://placeholder@localhost:5432/placeholder
        run: pnpm knip
