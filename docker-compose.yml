# Local development stack. Everything runs in containers, no cloud dependencies.
# Usage:
#   docker compose up -d        # start infra (db, redis, qdrant, rustfs)
#   pnpm dev                    # run app + workers on host with hot reload
#
# To run app + workers in containers too (closer to prod parity):
#   docker compose --profile app up

name: timeline

services:
  # ---- Postgres ----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: timeline
      POSTGRES_PASSWORD: timeline_dev
      POSTGRES_DB: timeline
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U timeline -d timeline']
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Redis (for BullMQ job queues) ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Qdrant (vector DB) ----
  # REST on 6333, gRPC on 6334. Use 6333 from app code via the JS client.
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-dev_qdrant_key}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'perl -MIO::Socket::INET -e ''exit(IO::Socket::INET->new(PeerAddr=>"127.0.0.1",PeerPort=>6333,Proto=>"tcp")?0:1)''',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- RustFS (S3-compatible object storage) ----
  # S3 API on 9000, console on 9001. Bucket creation handled by `rustfs-init`.
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      RUSTFS_ROOT_USER: timeline
      RUSTFS_ROOT_PASSWORD: timeline_dev_secret
      RUSTFS_VOLUMES: /data
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot init container: creates buckets and sets versioning.
  # Runs to completion then exits. `docker compose up` re-runs it; idempotent.
  rustfs-init:
    image: minio/mc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ROOT_USER: timeline
      RUSTFS_ROOT_PASSWORD: timeline_dev_secret
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://rustfs:9000 $$RUSTFS_ROOT_USER $$RUSTFS_ROOT_PASSWORD;
        mc mb --ignore-existing local/timeline-audio;
        mc mb --ignore-existing local/timeline-attachments;
        mc mb --ignore-existing local/timeline-exports;
        mc mb --ignore-existing local/timeline-documents;
        mc version enable local/timeline-audio;
        mc version enable local/timeline-attachments;
        mc version enable local/timeline-documents;
        printf '%s' '<CORSConfiguration xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><CORSRule><AllowedOrigin>http://localhost:*</AllowedOrigin><AllowedOrigin>http://127.0.0.1:*</AllowedOrigin><AllowedMethod>GET</AllowedMethod><AllowedMethod>HEAD</AllowedMethod><AllowedMethod>PUT</AllowedMethod><AllowedHeader>*</AllowedHeader><ExposeHeader>ETag</ExposeHeader></CORSRule></CORSConfiguration>' |
          mc cors set local/timeline-documents -;
        echo 'RustFS buckets ready.';

  # ---- App services (optional, --profile app) ----
  # For most local dev you run web/workers on host via `pnpm dev` for hot reload.
  # These profiles let you exercise the full container stack when needed.

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
        SENTRY_RELEASE: ${SENTRY_RELEASE:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0}
        NEXT_PUBLIC_SENTRY_PROFILES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_PROFILES_SAMPLE_RATE:-0}
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://timeline:timeline_dev@postgres:5432/timeline
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-dev_qdrant_key}
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: timeline
      S3_SECRET_ACCESS_KEY: timeline_dev_secret
      S3_FORCE_PATH_STYLE: 'true'
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: http://localhost:3000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      POSTMARK_WEBHOOK_SECRET: ${POSTMARK_WEBHOOK_SECRET}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0}
      NEXT_PUBLIC_SENTRY_PROFILES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_PROFILES_SAMPLE_RATE:-0}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

  worker:
    profiles: ['app']
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
        SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://timeline:timeline_dev@postgres:5432/timeline
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-dev_qdrant_key}
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: timeline
      S3_SECRET_ACCESS_KEY: timeline_dev_secret
      S3_FORCE_PATH_STYLE: 'true'
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  rustfs_data:
