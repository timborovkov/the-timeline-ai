<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body
    style="
      margin: 0;
      background: #f6f7f7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #171717;
    "
  >
    <div style="display: none; max-height: 0; overflow: hidden">{{preview}}</div>
    <main style="max-width: 640px; margin: 0 auto; padding: 32px 20px">
      <div
        style="
          font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: #68a500;
          font-size: 12px;
          margin-bottom: 20px;
        "
      >
        The Timeline
      </div>
      <section
        style="background: #fff; border: 1px solid #d8dddd; border-radius: 6px; padding: 24px"
      >
        <h1 style="font-size: 22px; line-height: 1.25; margin: 0 0 16px">{{title}}</h1>
        {{{body}}} {{{ctaBlock}}}
      </section>
      <p style="font-size: 12px; color: #747b7b; margin-top: 20px">
        You received this because this address is connected to The Timeline.
      </p>
    </main>
  </body>
</html>
