packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@sentry/cli': true
  core-js: false
  esbuild: true
  ffmpeg-static: true
  msgpackr-extract: true
  sharp: true

peerDependencyRules:
  allowedVersions:
    '@sentry/server-utils>vite': '8'

# Hoist all drizzle-orm/pglite/postgres-js transitives to a single
# resolution so peer-dep variants don't fork the type identity of
# drizzle's column types. Without this, adding @electric-sql/pglite
# (a drizzle peer) made pnpm install two parallel drizzle-orm@0.38.4
# instances and the nominal types from @timeline/db stopped matching
# the ones consumed by @timeline/shared.
dedupe-peer-dependents: true
public-hoist-pattern:
  - 'drizzle-orm'
minimumReleaseAgeExclude:
  - '@firecrawl/pdf-inspector-darwin-arm64@1.12.0'
  - '@firecrawl/pdf-inspector-linux-arm64-gnu@1.12.0'
  - '@firecrawl/pdf-inspector-linux-arm64-musl@1.12.0'
  - '@firecrawl/pdf-inspector-linux-x64-gnu@1.12.0'
  - '@firecrawl/pdf-inspector-linux-x64-musl@1.12.0'
  - '@firecrawl/pdf-inspector-win32-x64-msvc@1.12.0'
  - '@firecrawl/pdf-inspector@1.12.0'
